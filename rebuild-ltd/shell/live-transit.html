  <section id="card-trip" data-mount="card-trip" hidden></section>
  <section id="card-ride" data-mount="card-ride" hidden></section>

<aside id="panel-browse" data-mount="panel-browse" hidden></aside>
<aside id="panel-filter" data-mount="panel-filter" hidden></aside>

<div id="toast-region" data-mount="toasts"></div>
<div id="sr-live" class="sr-only" aria-live="polite" data-mount="sr-live"></div>
